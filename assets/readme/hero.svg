<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="i2p-hero-title i2p-hero-desc">
  <title id="i2p-hero-title">Idea2Prototype — turn ideas into tested prototypes, token-lean, for any coding agent</title>
  <desc id="i2p-hero-desc">Split hero: the Idea2Prototype name and promise on the left; on the right, a terminal showing the whole check verdict — syntax PASS, tests PASS, boot PASS — in about 60 tokens.</desc>

  <!-- background card: supplies its own surface, safe on GitHub light and dark -->
  <rect width="1200" height="340" rx="26" fill="#0B0E14"/>

  <!-- column divider -->
  <line x1="652" y1="56" x2="652" y2="284" stroke="#1C2430" stroke-width="1"/>

  <!-- ============ left: identity ============ -->
  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20" font-weight="600" letter-spacing="2.5" fill="#3FB950">idea &#8594; scaffold &#8594; tests &#8594; verdict</text>
    <text x="62" y="152" font-size="64" font-weight="700" fill="#F2F6FA">Idea2Prototype</text>
    <text x="64" y="200" font-size="25" fill="#AEB9C4">Turn ideas into tested prototypes &#8212;</text>
    <text x="64" y="234" font-size="25" fill="#AEB9C4">token-lean, for any coding agent.</text>
    <text x="64" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" fill="#7E8A96">node &#8805; 18.17 &#183; 0 dependencies &#183; MIT &#183; CLI: i2p</text>
  </g>

  <!-- ============ right: the verdict, live ============ -->
  <g id="verdict-terminal">
    <rect x="688" y="48" width="448" height="244" rx="14" fill="#0F141C" stroke="#222B37" stroke-width="1"/>
    <circle cx="712" cy="78" r="4.5" fill="#2B3542"/>
    <circle cx="730" cy="78" r="4.5" fill="#2B3542"/>
    <circle cx="748" cy="78" r="4.5" fill="#2B3542"/>
    <text x="772" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" fill="#7D8894">bash &#8212; my-app</text>
    <text x="1116" y="84" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" fill="#D29922">&#8776; 60 tokens</text>
    <line x1="688" y1="100" x2="1136" y2="100" stroke="#1A212B" stroke-width="1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
      <text x="716" y="136"><tspan fill="#3FB950">$</tspan><tspan fill="#E8EDF2"> npm run check</tspan></text>
      <text x="716" y="172" fill="#E8EDF2">Idea2Prototype check &#8212; <tspan fill="#3FB950" font-weight="700">PASS</tspan> (3/3)</text>

      <text x="716" y="206" fill="#8B98A5">syntax</text>
      <text x="806" y="206" fill="#3FB950" font-weight="600">PASS</text>
      <text x="864" y="206" font-size="18" fill="#66717D">3 files parse clean</text>

      <text x="716" y="240" fill="#8B98A5">tests</text>
      <text x="806" y="240" fill="#3FB950" font-weight="600">PASS</text>
      <text x="864" y="240" font-size="18" fill="#66717D">3 tests &#183; 1 file</text>

      <text x="716" y="274" fill="#8B98A5">boot</text>
      <text x="806" y="274" fill="#3FB950" font-weight="600">PASS</text>
      <text x="864" y="274" font-size="18" fill="#66717D">GET / &#8594; 200 &#183; 45ms</text>
    </g>
  </g>
</svg>
