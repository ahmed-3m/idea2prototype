# Publishes the package to two npm registries whenever a release is published:
#  - GitHub Packages (npm.pkg.github.com) — GITHUB_TOKEN auth, always runs
#  - npmjs.org — NPM_TOKEN secret; npmjs is the documented PRIMARY channel, so
#    a release without the secret fails loudly (a mirror-only release would
#    silently invert the README's install claims). Manual workflow_dispatch
#    without the secret still skips with a visible warning — it is a deliberate
#    operator re-publish action, not a release. Both channels carry the scoped
#    name @ahmed-3m/idea2prototype (GitHub Packages hosts scoped names only).
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-packages:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'   # re-dispatch targets npmjs only; this job would 409
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Guard - ref must match package.json version
        # unconditional: workflow_dispatch must target the release tag, never a branch
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "v$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npmjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Guard - ref must match package.json version
        # unconditional: workflow_dispatch must target the release tag, never a branch
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "v$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "release" ]; then
              echo "::error::NPM_TOKEN not configured - npmjs is the documented primary channel, refusing to publish this release mirror-only"
              exit 1
            fi
            echo "::warning::NPM_TOKEN secret not configured - skipping npmjs publish (manual dispatch)"
            exit 0
          fi
          npm publish --access public
